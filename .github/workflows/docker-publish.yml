name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # every Monday at 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required for SLSA provenance signing
      attestations: write  # required for actions/attest-build-provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # For scheduled runs, check out the latest released tag so we rebuild
      # actual release code (not untagged commits on main). Overriding
      # GITHUB_REF makes docker/metadata-action generate correct semver tags.
      - name: Resolve latest release for scheduled builds
        if: github.event_name == 'schedule'
        run: |
          git fetch --tags --force
          TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$TAG" ]; then
            git checkout "$TAG"
            echo "GITHUB_REF=refs/tags/${TAG}" >> "$GITHUB_ENV"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: blackswifthosting/ingress-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max   # SLSA provenance attestation (embedded in OCI manifest)
          sbom: true             # SPDX SBOM attestation (embedded in OCI manifest)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub-signed SLSA provenance stored in GitHub's attestation store.
      # Verifiable with: gh attestation verify oci://blackswifthosting/ingress-proxy --owner <org>
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/blackswifthosting/ingress-proxy
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  update-description:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: blackswifthosting/ingress-proxy
          readme-filepath: ./README.md
